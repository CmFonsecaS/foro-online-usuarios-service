# Nombre del microservicio
spring.application.name=usuarios-service

# Puerto del microservicio
server.port=8081

# Conexion Oracle Autonomous Database (variables de entorno)
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=oracle.jdbc.OracleDriver
spring.datasource.hikari.maximum-pool-size=5

# Configuracion JPA
spring.jpa.hibernate.ddl-auto=none
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.OracleDialect
spring.jpa.open-in-view=false
spring.jpa.show-sql=${SHOW_SQL:false}

# Configuracion JWT
app.jwt.secret=${JWT_SECRET}
app.jwt.expiration-minutes=60

# Origenes permitidos para el FrontEnd Angular
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:4200}

# Health check para el despliegue (incluye la conexion a Oracle)
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
